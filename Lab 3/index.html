<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>World Countries Quiz</title>
</head>
<body>
    <h1 id="title">How well do you know geography!</h1>

    
    <div id="mainDiv">
        <label for="basic-input" class="regText">What is the biggest country?</label>
    <input id="basic-input" class="regText">

    <br>
    <br>

    <label for="radio" class="regText">Which of these countries borders Peru</label>
    <div id="q2Div" class="regText">

    </div>

    <br>
    <br>

    <input type="radio" name="peru_borders" class="radios" value="Chile"><label for="Chile">Chile</label>
    <input type="radio" name="peru_borders" class="radios" value="Canada"><label for="Canada">Canada</label>

    <label for="newest_country_dropdown" class="regText">What is the newest country?</label>
    <select id="newest_country_dropdown" class="regText">
        <option id="Scotland" value="Scotland" class="regText">Scotland</option>
        <option id="East_Timor" value="East_Timor" class="regText">East Timor</option>
        <option id="South_Sudan" value="South_Sudan" class="regText">South Sudan</option>
        <option id="Montenegro" value="Montenegro" class="regText">Montenegro</option>
    </select>

    <br>
    <br>

    <label for="stan_numbers" class="regText">How many "stan" countries are in Asia?</label>
    <input id="age-input" max="10" type="number" class="regText">

    <br>
    <br>

    <p>What countries of those listed are in the European Unioon</p>
    <input type="checkbox" name="eu_countries" class="checkboxes" value="United Kingdom" ><label for="United Kingdom" class="regText">United Kingdom</label>
    <input type="checkbox" name="eu_countries" class="checkboxes" value="Portugal"><label for="Portugal" class="regText">Portugal</label>
    <input type="checkbox" name="eu_countries" class="checkboxes" value="France"><label for="France" class="regText">France</label>
    <input type="checkbox" name="eu_countries" class="checkboxes" value="Serbia"><label for="Serbia" class="regText">Serbia</label>
    <input type="checkbox" name="eu_countries" class="checkboxes" value="Greece"><label for="Greece" class="regText">Greece</label>

    <br>
    <br>

    <button id="submit_button">Submit</button>
    </div>
    

    <script src="js/script.js" defer></script>
</body>
